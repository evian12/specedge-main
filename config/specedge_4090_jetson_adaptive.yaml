version: 1
opt: 2

base:
  result_path: "result/4090_jetson"
  exp_name: "specedge_adaptive"
  dtype: fp16
  seed: 42
  ssh_key: ~/.ssh/id_ed25519
  max_len: 2048

server:
  process_name: server
  target_model: /home/yypan/models/Llama-2-7b-chat-hf
  device: cuda:0
  temperature: 0.7
  max_batch_size: 1
  num_clients: 1
  batch_type: static
  cache_prefill: true

client:
  host: 127.0.0.1:18001
  process_name: client
  draft_model: /home/yypan/models/TinyLlama-1.1B
  dataset: specbench
  reasoning: False
  sample_req_cnt: 8
  req_offset: 0
  max_n_beams: 32
  max_beam_len: 4
  max_branch_width: 16
  max_budget: 32
  proactive:
    type: excluded
    mode: adaptive
    max_n_beams: 32
    max_beam_len: 3
    max_branch_width: 16
    max_budget: 32
    adaptive:
      ewma_alpha: 0.2
      min_alignment_rate: 0.1
      warmup_cycles: 4
      exploration_interval: 8
      safety_margin_ms: 2.0
  max_new_tokens: 64
  max_request_num: -1

node:
  jetson:
    - device: cuda:0
