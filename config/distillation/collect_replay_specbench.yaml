mode: kd
seed: 2030
input_path: data/distillation/specbench_pilot/sft_train.jsonl
output_path: data/distillation/rejection_replay/specbench_train.jsonl
teacher_model: /home/yypan/models/Llama-2-7b-chat-hf
student_model: checkpoints/AMD-Llama-135m-acceptance-kd-mixed/epoch-3
device: cuda:0
dtype: fp16
apply_chat_template: true
allow_test_input: false
max_samples: -1
max_seq_len: 512
teacher_top_k: 32
distillation_temperature: 1.0

# Reuse the held training responses already generated by the teacher. Only
# positions where the selected student disagrees with the teacher are active.
generation:
  source: teacher
  reuse_response: true
  max_prompt_tokens: 448
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0

loss_mask:
  mode: student_rejections
  min_teacher_confidence: 0.20
  window_size: 1
  drop_no_rejections: true
