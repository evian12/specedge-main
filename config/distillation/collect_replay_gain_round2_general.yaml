mode: kd
seed: 2051
input_path: data/distillation/rejection_replay/general_train.jsonl
output_path: data/distillation/rejection_replay_gain_round2/general_train.jsonl
teacher_model: /home/yypan/models/Llama-2-7b-chat-hf
student_model: checkpoints/AMD-Llama-135m-rejection-replay-gain/epoch-2
device: cuda:0
dtype: fp16
apply_chat_template: false
allow_test_input: false
max_samples: -1
max_seq_len: 512
teacher_top_k: 32
distillation_temperature: 1.0

generation:
  source: teacher
  reuse_response: true
  max_prompt_tokens: 448
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0

loss_mask:
  mode: student_rejections
  weighting: acceptance_gain
  min_teacher_confidence: 0.20
  window_size: 1
  max_accept_depth: 7
  max_weight: 4.0
  drop_no_rejections: true
