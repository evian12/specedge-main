mode: kd
seed: 42
input_path: data/distillation/mixture/train.jsonl
output_path: data/distillation/amd135m/kd_train.jsonl
teacher_model: /home/yypan/models/Llama-2-7b-chat-hf
student_model: checkpoints/AMD-Llama-135m-sft/best
device: cuda:0
dtype: fp16
apply_chat_template: true
allow_test_input: false
max_samples: -1
max_seq_len: 2048
teacher_top_k: 64
distillation_temperature: 1.0

# Student generation produces on-policy prefixes. The target model then
# scores every response position and stores sparse top-k probabilities.
generation:
  source: student
  reuse_response: false
  max_prompt_tokens: 1536
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9
